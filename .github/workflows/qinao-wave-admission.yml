name: Qinao protected unsigned current-wave preparation

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact candidate commit to evaluate
        required: true
        type: string
      candidate_tree:
        description: Exact candidate tree expected for that commit
        required: true
        type: string
      current_wave_bundle:
        description: Normalized current wave-bundle path in the candidate tree
        required: true
        type: string

permissions: {}

# Operational admission prerequisite, not a YAML claim:
# - qinao-candidate-jit and qinao-admission-jit must each provision a fresh,
#   one-job ephemeral runner and destroy it after that one job;
# - the groups must use different physical instances, OS users, and runner groups.
# Labels, groups, and READY variables constrain scheduling but cannot attest that
# lifecycle. The final job therefore remains fail-closed before any authority
# transition until Phase C supplies an independently verifiable operation wire.
jobs:
  runner-isolation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      QINAO_CANDIDATE_JIT_READY: ${{ vars.QINAO_CANDIDATE_JIT_READY }}
      QINAO_ADMISSION_JIT_READY: ${{ vars.QINAO_ADMISSION_JIT_READY }}
    steps:
      - name: Assert protected bootstrap ref
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_REF" != \
            "refs/heads/qinao-admission-bootstrap-v1"
          then
            printf '%s\n' "BLOCKED_PHASE_C_PROTECTED_REF_REQUIRED"
            exit 1
          fi
      - name: Require explicit one-job runner readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for variable in \
            QINAO_CANDIDATE_JIT_READY \
            QINAO_ADMISSION_JIT_READY
          do
            if test "${!variable}" != "true"; then
              printf '%s:%s\n' \
                "BLOCKED_PHASE_C_RUNNER_ISOLATION_ATTESTATION_REQUIRED" \
                "$variable"
              ready=false
            fi
          done
          test "$ready" = "true"
          printf '%s\n' \
            "READY variables are operator assertions, not runner-lifecycle proof"

  candidate-validation:
    needs: runner-isolation-guard
    if: ${{ github.ref == 'refs/heads/qinao-admission-bootstrap-v1' }}
    runs-on:
      group: qinao-candidate-jit
      labels: [self-hosted, macOS, xcode-27]
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      envelope_sha256: ${{ steps.snapshot.outputs.envelope_sha256 }}
      envelope_size: ${{ steps.snapshot.outputs.envelope_size }}
      log_sha256: ${{ steps.snapshot.outputs.log_sha256 }}
      log_size: ${{ steps.snapshot.outputs.log_size }}
      manifest_sha256: ${{ steps.snapshot.outputs.manifest_sha256 }}
      manifest_size: ${{ steps.snapshot.outputs.manifest_size }}
    env:
      QINAO_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      QINAO_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
      QINAO_CANDIDATE_VALIDATION_RELATIVE: qinao-candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}
      GIT_ATTR_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "9"
      GIT_CONFIG_GLOBAL: "/dev/null"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_SYSTEM: "/dev/null"
      GIT_CONFIG_KEY_0: core.fsmonitor
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: /dev/null
      GIT_CONFIG_KEY_2: diff.external
      GIT_CONFIG_VALUE_2: ""
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
      GIT_CONFIG_KEY_4: submodule.recurse
      GIT_CONFIG_VALUE_4: "false"
      GIT_CONFIG_KEY_5: filter.lfs.clean
      GIT_CONFIG_VALUE_5: ""
      GIT_CONFIG_KEY_6: filter.lfs.smudge
      GIT_CONFIG_VALUE_6: ""
      GIT_CONFIG_KEY_7: filter.lfs.process
      GIT_CONFIG_VALUE_7: ""
      GIT_CONFIG_KEY_8: filter.lfs.required
      GIT_CONFIG_VALUE_8: "false"
      GIT_LITERAL_PATHSPECS: "1"
      GIT_NO_LAZY_FETCH: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_PAGER: cat
      GIT_TERMINAL_PROMPT: "0"
      PAGER: cat
      XDG_CONFIG_HOME: /nonexistent
    steps:
      - name: Assert isolated candidate root is absent
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ""|*[!0-9]*) exit 64 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ""|*[!0-9]*) exit 64 ;; esac
          test "$QINAO_CANDIDATE_VALIDATION_RELATIVE" = \
            "qinao-candidate-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          candidate_root="$GITHUB_WORKSPACE/$QINAO_CANDIDATE_VALIDATION_RELATIVE"
          case "$candidate_root" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) exit 64 ;;
          esac
          test ! -e "$candidate_root"
          test ! -L "$candidate_root"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_commit }}
          path: ${{ env.QINAO_CANDIDATE_VALIDATION_RELATIVE }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Validate candidate without admission authority
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/qinao-admission-bootstrap-v1"
          candidate_root="$GITHUB_WORKSPACE/$QINAO_CANDIDATE_VALIDATION_RELATIVE"
          qinao_read_head_object() {
            test "$#" -eq 2
            repository_root="$1"
            case "$2" in
              commit) object_expression='HEAD^{commit}' ;;
              tree) object_expression='HEAD^{tree}' ;;
              *) return 64 ;;
            esac
            /usr/bin/env -i \
              HOME=/nonexistent \
              LANG=C \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              XDG_CONFIG_HOME=/nonexistent \
              GIT_ATTR_NOSYSTEM=1 \
              GIT_CONFIG_COUNT=9 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_CONFIG_KEY_0=core.fsmonitor \
              GIT_CONFIG_VALUE_0=false \
              GIT_CONFIG_KEY_1=core.hooksPath \
              GIT_CONFIG_VALUE_1=/dev/null \
              GIT_CONFIG_KEY_2=diff.external \
              GIT_CONFIG_VALUE_2= \
              GIT_CONFIG_KEY_3=core.pager \
              GIT_CONFIG_VALUE_3=cat \
              GIT_CONFIG_KEY_4=submodule.recurse \
              GIT_CONFIG_VALUE_4=false \
              GIT_CONFIG_KEY_5=filter.lfs.clean \
              GIT_CONFIG_VALUE_5= \
              GIT_CONFIG_KEY_6=filter.lfs.smudge \
              GIT_CONFIG_VALUE_6= \
              GIT_CONFIG_KEY_7=filter.lfs.process \
              GIT_CONFIG_VALUE_7= \
              GIT_CONFIG_KEY_8=filter.lfs.required \
              GIT_CONFIG_VALUE_8=false \
              GIT_LITERAL_PATHSPECS=1 \
              GIT_NO_LAZY_FETCH=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_PAGER=cat \
              GIT_TERMINAL_PROMPT=0 \
              PAGER=cat \
              /usr/bin/git \
                --no-pager \
                --no-optional-locks \
                --no-replace-objects \
                -C "$repository_root" \
                rev-parse --verify "$object_expression"
          }
          test "$(qinao_read_head_object "$candidate_root" commit)" = \
            "$QINAO_CANDIDATE_COMMIT"
          test "$(qinao_read_head_object "$candidate_root" tree)" = \
            "$QINAO_CANDIDATE_TREE"

          artifact_root="$RUNNER_TEMP/qinao-candidate-validation"
          test ! -e "$artifact_root"
          test ! -L "$artifact_root"
          raw_log="$RUNNER_TEMP/qinao-candidate-validation.raw.log"
          test ! -e "$raw_log"
          test ! -L "$raw_log"
          if ! /usr/bin/python3 - \
            "$candidate_root" \
            "$raw_log" \
            "$artifact_root" \
            "2400" <<'PY'
          import ctypes
          import errno
          import hashlib
          import os
          import selectors
          import signal
          import stat
          import subprocess
          import sys
          import time

          (
              candidate_root,
              raw_log,
              artifact_root,
              validation_timeout_text,
          ) = sys.argv[1:]
          try:
              validation_timeout_seconds = float(
                  validation_timeout_text
              )
          except ValueError as error:
              raise SystemExit(64) from error
          if not 0.05 <= validation_timeout_seconds <= 2400:
              raise SystemExit(64)
          validation_script = r'''
          set -euo pipefail
          python3 -m unittest \
            scripts.test_check_qinao_owner_ledger \
            scripts.test_run_nonempty_swift_filter \
            scripts.test_run_nonempty_xcode_test \
            scripts.test_check_artifact_mesh_device_recovery \
            scripts.test_run_qinao_wave_admission \
            scripts.test_prepare_qinao_v2_wave_candidate \
            scripts.test_run_qinao_managed_convergence \
            scripts.test_run_qinao_k4_ios27_platform_spike \
            scripts.test_qinao_admission_canonical_vectors \
            scripts.test_qinao_plan_remediation \
            scripts.test_test_workflow_owner_ledger
          BehavioralAISubstrate/scripts/check-ios27-floor.sh
          '''
          runtime_temp = os.environ["RUNNER_TEMP"]
          if (
              not os.path.isabs(runtime_temp)
              or os.path.realpath(runtime_temp) != runtime_temp
              or os.path.islink(runtime_temp)
              or not os.path.isdir(runtime_temp)
          ):
              raise SystemExit(64)
          environment = {
              "GIT_ATTR_NOSYSTEM": "1",
              "GIT_CONFIG_COUNT": "9",
              "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_CONFIG_SYSTEM": "/dev/null",
              "GIT_CONFIG_KEY_0": "core.fsmonitor",
              "GIT_CONFIG_VALUE_0": "false",
              "GIT_CONFIG_KEY_1": "core.hooksPath",
              "GIT_CONFIG_VALUE_1": "/dev/null",
              "GIT_CONFIG_KEY_2": "diff.external",
              "GIT_CONFIG_VALUE_2": "",
              "GIT_CONFIG_KEY_3": "core.pager",
              "GIT_CONFIG_VALUE_3": "cat",
              "GIT_CONFIG_KEY_4": "submodule.recurse",
              "GIT_CONFIG_VALUE_4": "false",
              "GIT_CONFIG_KEY_5": "filter.lfs.clean",
              "GIT_CONFIG_VALUE_5": "",
              "GIT_CONFIG_KEY_6": "filter.lfs.smudge",
              "GIT_CONFIG_VALUE_6": "",
              "GIT_CONFIG_KEY_7": "filter.lfs.process",
              "GIT_CONFIG_VALUE_7": "",
              "GIT_CONFIG_KEY_8": "filter.lfs.required",
              "GIT_CONFIG_VALUE_8": "false",
              "GIT_LITERAL_PATHSPECS": "1",
              "GIT_NO_LAZY_FETCH": "1",
              "GIT_NO_REPLACE_OBJECTS": "1",
              "GIT_OPTIONAL_LOCKS": "0",
              "GIT_PAGER": "cat",
              "GIT_TERMINAL_PROMPT": "0",
              "HOME": "/nonexistent",
              "LANG": "C",
              "LC_ALL": "C",
              "PAGER": "cat",
              "PATH": "/usr/bin:/bin",
              "PYTHONDONTWRITEBYTECODE": "1",
              "TMPDIR": runtime_temp,
              "TZ": "UTC",
              "XDG_CONFIG_HOME": "/nonexistent",
          }
          flags = os.O_RDWR | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          log_descriptor = os.open(raw_log, flags, 0o600)
          os.fchmod(log_descriptor, 0o600)

          if hasattr(os, "waitid"):
              libc_waitid = None
          else:
              libc = ctypes.CDLL(None, use_errno=True)
              libc_waitid = libc.waitid
              libc_waitid.argtypes = [
                  ctypes.c_int,
                  ctypes.c_uint,
                  ctypes.c_void_p,
                  ctypes.c_int,
              ]
              libc_waitid.restype = ctypes.c_int

          def observe_process_exit(process_id):
              wait_flags = os.WEXITED | os.WNOHANG | os.WNOWAIT
              if hasattr(os, "waitid"):
                  return (
                      os.waitid(
                          os.P_PID,
                          process_id,
                          wait_flags,
                      )
                      is not None
                  )
              signal_information = ctypes.create_string_buffer(256)
              result = libc_waitid(
                  int(os.P_PID),
                  process_id,
                  ctypes.byref(signal_information),
                  wait_flags,
              )
              if result != 0:
                  error_number = ctypes.get_errno()
                  raise OSError(
                      error_number,
                      os.strerror(error_number),
                  )
              return any(signal_information.raw)

          def write_all(descriptor, content):
              offset = 0
              while offset < len(content):
                  written = os.write(descriptor, content[offset:])
                  if written == 0:
                      raise OSError(
                          errno.EIO,
                          "zero-byte write before content completion",
                      )
                  offset += written

          def transfer_validation_output(
              selector,
              log_descriptor,
              log_digest,
              log_bytes,
              wait_seconds,
          ):
              pipe_open = True
              limit_exceeded = False
              transfer_failed = False
              try:
                  events = selector.select(wait_seconds)
              except OSError:
                  return log_bytes, False, False, True
              for key, _ in events:
                  try:
                      chunk = os.read(key.fd, 65536)
                  except BlockingIOError:
                      continue
                  except OSError:
                      transfer_failed = True
                      try:
                          selector.unregister(key.fd)
                      except KeyError:
                          pass
                      pipe_open = False
                      continue
                  if not chunk:
                      try:
                          selector.unregister(key.fd)
                      except KeyError:
                          pass
                      pipe_open = False
                      continue
                  remaining = max(0, 8388608 - log_bytes)
                  accepted = chunk[:remaining]
                  if accepted:
                      try:
                          write_all(log_descriptor, accepted)
                      except OSError:
                          transfer_failed = True
                          try:
                              selector.unregister(key.fd)
                          except KeyError:
                              pass
                          pipe_open = False
                      else:
                          log_bytes += len(accepted)
                          log_digest.update(accepted)
                  if len(chunk) > remaining:
                      limit_exceeded = True
              return (
                  log_bytes,
                  limit_exceeded,
                  pipe_open,
                  transfer_failed,
              )

          def signal_validation_group(validation_group, group_signal):
              try:
                  os.killpg(validation_group, group_signal)
              except ProcessLookupError:
                  return False
              except OSError as error:
                  if error.errno == errno.ESRCH:
                      return False
                  raise
              return True

          def metadata_tuple(metadata):
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  metadata.st_mode,
                  metadata.st_nlink,
                  metadata.st_size,
                  metadata.st_uid,
              )

          def digest_descriptor(descriptor):
              os.lseek(descriptor, 0, os.SEEK_SET)
              digest = hashlib.sha256()
              byte_count = 0
              while True:
                  chunk = os.read(descriptor, 65536)
                  if not chunk:
                      break
                  digest.update(chunk)
                  byte_count += len(chunk)
              return byte_count, digest.hexdigest()

          def verify_bound_raw_log(
              descriptor,
              path,
              expected_size,
              expected_digest,
          ):
              os.fsync(descriptor)
              descriptor_before = os.fstat(descriptor)
              path_metadata = os.lstat(path)
              if (
                  metadata_tuple(descriptor_before)
                  != metadata_tuple(path_metadata)
                  or not stat.S_ISREG(descriptor_before.st_mode)
                  or stat.S_IMODE(descriptor_before.st_mode) != 0o600
                  or descriptor_before.st_nlink != 1
                  or descriptor_before.st_size != expected_size
                  or descriptor_before.st_uid != os.geteuid()
              ):
                  raise RuntimeError(
                      "candidate raw log binding changed"
                  )
              actual_size, actual_digest = digest_descriptor(descriptor)
              descriptor_after = os.fstat(descriptor)
              if (
                  metadata_tuple(descriptor_before)
                  != metadata_tuple(descriptor_after)
                  or actual_size != expected_size
                  or actual_digest != expected_digest
              ):
                  raise RuntimeError(
                      "candidate raw log content changed"
                  )

          def publish_bound_validation_log(
              descriptor,
              path,
              artifact_root,
              expected_size,
              expected_digest,
          ):
              verify_bound_raw_log(
                  descriptor,
                  path,
                  expected_size,
                  expected_digest,
              )
              try:
                  os.lstat(artifact_root)
              except FileNotFoundError:
                  pass
              else:
                  raise RuntimeError(
                      "candidate artifact root appeared during validation"
                  )
              os.mkdir(artifact_root, 0o700)
              root_flags = os.O_RDONLY
              if hasattr(os, "O_DIRECTORY"):
                  root_flags |= os.O_DIRECTORY
              if hasattr(os, "O_NOFOLLOW"):
                  root_flags |= os.O_NOFOLLOW
              root_descriptor = os.open(artifact_root, root_flags)
              try:
                  os.fchmod(root_descriptor, 0o700)
                  root_metadata = os.fstat(root_descriptor)
                  root_path_metadata = os.lstat(artifact_root)
                  if (
                      root_metadata.st_dev
                      != root_path_metadata.st_dev
                      or root_metadata.st_ino
                      != root_path_metadata.st_ino
                      or not stat.S_ISDIR(root_metadata.st_mode)
                      or stat.S_IMODE(root_metadata.st_mode) != 0o700
                      or root_metadata.st_uid != os.geteuid()
                  ):
                      raise RuntimeError(
                          "candidate artifact root binding changed"
                      )
                  target_flags = os.O_RDWR | os.O_CREAT | os.O_EXCL
                  if hasattr(os, "O_NOFOLLOW"):
                      target_flags |= os.O_NOFOLLOW
                  target_descriptor = os.open(
                      "validation.log",
                      target_flags,
                      0o600,
                      dir_fd=root_descriptor,
                  )
                  try:
                      os.fchmod(target_descriptor, 0o600)
                      os.lseek(descriptor, 0, os.SEEK_SET)
                      remaining = expected_size
                      while remaining:
                          chunk = os.read(
                              descriptor,
                              min(65536, remaining),
                          )
                          if not chunk:
                              raise RuntimeError(
                                  "candidate raw log shortened during copy"
                              )
                          write_all(target_descriptor, chunk)
                          remaining -= len(chunk)
                      if os.read(descriptor, 1):
                          raise RuntimeError(
                              "candidate raw log grew during copy"
                          )
                      os.fsync(target_descriptor)
                      target_metadata = os.fstat(target_descriptor)
                      target_path_metadata = os.stat(
                          "validation.log",
                          dir_fd=root_descriptor,
                          follow_symlinks=False,
                      )
                      target_size, target_digest = digest_descriptor(
                          target_descriptor
                      )
                      if (
                          metadata_tuple(target_metadata)
                          != metadata_tuple(target_path_metadata)
                          or not stat.S_ISREG(target_metadata.st_mode)
                          or stat.S_IMODE(target_metadata.st_mode)
                          != 0o600
                          or target_metadata.st_nlink != 1
                          or target_metadata.st_size != expected_size
                          or target_metadata.st_uid != os.geteuid()
                          or target_size != expected_size
                          or target_digest != expected_digest
                      ):
                          raise RuntimeError(
                              "published validation log is not exact"
                          )
                  finally:
                      os.close(target_descriptor)
                  root_after = os.fstat(root_descriptor)
                  root_path_after = os.lstat(artifact_root)
                  published_path_after = os.lstat(
                      os.path.join(
                          artifact_root,
                          "validation.log",
                      )
                  )
                  if (
                      root_after.st_dev != root_metadata.st_dev
                      or root_after.st_ino != root_metadata.st_ino
                      or root_path_after.st_dev != root_metadata.st_dev
                      or root_path_after.st_ino != root_metadata.st_ino
                      or published_path_after.st_dev
                      != target_metadata.st_dev
                      or published_path_after.st_ino
                      != target_metadata.st_ino
                  ):
                      raise RuntimeError(
                          "published artifact binding changed"
                      )
              finally:
                  os.close(root_descriptor)

          process = None
          return_code = 125
          cleanup_failed = False
          try:
              process = subprocess.Popen(
                  ["/bin/bash", "-c", validation_script],
                  cwd=candidate_root,
                  env=environment,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  close_fds=True,
                  start_new_session=True,
              )
              validation_group = process.pid
              process_stdout = process.stdout
              output_selector = None
              log_bytes = 0
              log_digest = hashlib.sha256()
              pipe_open = False
              log_limit_exceeded = False
              output_failed = False
              timed_out = False
              leader_observed = False
              reaped_return_code = 125
              try:
                  if process_stdout is None:
                      raise RuntimeError(
                          "candidate output pipe is absent"
                      )
                  pipe_descriptor = process_stdout.fileno()
                  os.set_blocking(pipe_descriptor, False)
                  output_selector = selectors.DefaultSelector()
                  output_selector.register(
                      pipe_descriptor,
                      selectors.EVENT_READ,
                  )
                  pipe_open = True
                  deadline = (
                      time.monotonic()
                      + validation_timeout_seconds
                  )
                  while True:
                      if pipe_open:
                          (
                              log_bytes,
                              output_limit_hit,
                              pipe_open,
                              transfer_failed,
                          ) = transfer_validation_output(
                              output_selector,
                              log_descriptor,
                              log_digest,
                              log_bytes,
                              0.05,
                          )
                          if output_limit_hit:
                              log_limit_exceeded = True
                              break
                          if transfer_failed:
                              output_failed = True
                              break
                      else:
                          time.sleep(0.05)
                      if observe_process_exit(process.pid):
                          leader_observed = True
                          break
                      if time.monotonic() >= deadline:
                          timed_out = True
                          break
                      time.sleep(0.05)
              finally:
                  term_permission_denied = False
                  try:
                      term_sent = signal_validation_group(
                          validation_group,
                          signal.SIGTERM,
                      )
                  except PermissionError:
                      # Darwin reports EPERM for a zombie-only group. Once
                      # waitid observed the unreaped leader, any live
                      # same-runner-user descendant would still be signalable.
                      term_permission_denied = True
                      term_sent = False
                  except OSError:
                      cleanup_failed = True
                      term_sent = False
                  if term_sent:
                      grace_deadline = time.monotonic() + 2.0
                      while time.monotonic() < grace_deadline:
                          if (
                              pipe_open
                              and output_selector is not None
                          ):
                              (
                                  log_bytes,
                                  output_limit_hit,
                                  pipe_open,
                                  transfer_failed,
                              ) = transfer_validation_output(
                                  output_selector,
                                  log_descriptor,
                                  log_digest,
                                  log_bytes,
                                  min(
                                      0.05,
                                      max(
                                          0,
                                          grace_deadline
                                          - time.monotonic(),
                                      ),
                                  ),
                              )
                              log_limit_exceeded = (
                                  log_limit_exceeded
                                  or output_limit_hit
                              )
                              output_failed = (
                                  output_failed or transfer_failed
                              )
                          else:
                              time.sleep(
                                  min(
                                      0.05,
                                      max(
                                          0,
                                          grace_deadline
                                          - time.monotonic(),
                                      ),
                                  )
                              )
                  if not leader_observed:
                      try:
                          leader_observed = observe_process_exit(
                              process.pid
                          )
                      except OSError:
                          cleanup_failed = True
                  kill_sent = False
                  try:
                      kill_sent = signal_validation_group(
                          validation_group,
                          signal.SIGKILL,
                      )
                  except PermissionError:
                      # Preserve the same zombie-only exception for the final
                      # SIGKILL; every unobserved denial remains fail-closed.
                      if not leader_observed:
                          try:
                              leader_observed = observe_process_exit(
                                  process.pid
                              )
                          except OSError:
                              cleanup_failed = True
                      if not leader_observed:
                          cleanup_failed = True
                  except OSError:
                      cleanup_failed = True
                  if (
                      term_permission_denied
                      and not leader_observed
                      and not kill_sent
                  ):
                      cleanup_failed = True
                  drain_deadline = time.monotonic() + 2.0
                  while (
                      pipe_open
                      and output_selector is not None
                      and time.monotonic() < drain_deadline
                  ):
                      (
                          log_bytes,
                          output_limit_hit,
                          pipe_open,
                          transfer_failed,
                      ) = transfer_validation_output(
                          output_selector,
                          log_descriptor,
                          log_digest,
                          log_bytes,
                          min(
                              0.05,
                              max(
                                  0,
                                  drain_deadline - time.monotonic(),
                              ),
                          ),
                      )
                      log_limit_exceeded = (
                          log_limit_exceeded or output_limit_hit
                      )
                      output_failed = (
                          output_failed or transfer_failed
                      )
                  if output_selector is not None:
                      try:
                          output_selector.close()
                      except OSError:
                          cleanup_failed = True
                  if process_stdout is not None:
                      try:
                          process_stdout.close()
                      except OSError:
                          cleanup_failed = True
                  try:
                      reaped_return_code = process.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      cleanup_failed = True
                      reaped_return_code = 125
                  return_code = (
                      125
                      if log_limit_exceeded or output_failed
                      else (
                          124 if timed_out else reaped_return_code
                      )
                  )
              if not cleanup_failed and return_code == 0:
                  publish_bound_validation_log(
                      log_descriptor,
                      raw_log,
                      artifact_root,
                      log_bytes,
                      log_digest.hexdigest(),
                  )
          finally:
              os.close(log_descriptor)
          if cleanup_failed:
              raise SystemExit(125)
          raise SystemExit(return_code)
          PY
          then
            printf '%s\n' "candidate validation failed; raw log withheld"
            exit 1
          fi
          test -d "$artifact_root"
          test ! -L "$artifact_root"
          test -f "$artifact_root/validation.log"
          test ! -L "$artifact_root/validation.log"
          test "$(wc -c < "$artifact_root/validation.log" | tr -d ' ')" \
            -le 8388608

          printf '%s\n' \
            "{\"authority\":\"none\",\"candidateCommit\":\"$QINAO_CANDIDATE_COMMIT\",\"candidateTree\":\"$QINAO_CANDIDATE_TREE\",\"outcome\":\"observed\",\"provenance\":\"candidate-runner-untrusted-observation\",\"schema\":\"QinaoCandidateValidationEnvelopeV1\"}" \
            > "$artifact_root/validation-envelope.json"
          chmod 0600 "$artifact_root/validation-envelope.json"

          envelope_sha256="$(shasum -a 256 "$artifact_root/validation-envelope.json" | cut -d ' ' -f 1)"
          envelope_size="$(wc -c < "$artifact_root/validation-envelope.json" | tr -d ' ')"
          log_sha256="$(shasum -a 256 "$artifact_root/validation.log" | cut -d ' ' -f 1)"
          log_size="$(wc -c < "$artifact_root/validation.log" | tr -d ' ')"
          printf '%s\n' \
            "{\"files\":[{\"byteLength\":$envelope_size,\"path\":\"validation-envelope.json\",\"sha256\":\"$envelope_sha256\"},{\"byteLength\":$log_size,\"path\":\"validation.log\",\"sha256\":\"$log_sha256\"}],\"schema\":\"QinaoCandidateValidationArtifactV1\"}" \
            > "$artifact_root/artifact-manifest.json"
          chmod 0600 "$artifact_root/artifact-manifest.json"
          manifest_sha256="$(shasum -a 256 "$artifact_root/artifact-manifest.json" | cut -d ' ' -f 1)"
          manifest_size="$(wc -c < "$artifact_root/artifact-manifest.json" | tr -d ' ')"
          test "$envelope_size" -le 4096
          test "$manifest_size" -le 4096
          artifact_total_size=$((envelope_size + log_size + manifest_size))
          test "$artifact_total_size" -le 8396800
          expected_files=$'artifact-manifest.json\nvalidation-envelope.json\nvalidation.log'
          actual_files="$(
            find "$artifact_root" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test -z "$(
            find "$artifact_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"

          {
            printf 'envelope_sha256=%s\n' "$envelope_sha256"
            printf 'envelope_size=%s\n' "$envelope_size"
            printf 'log_sha256=%s\n' "$log_sha256"
            printf 'log_size=%s\n' "$log_size"
            printf 'manifest_sha256=%s\n' "$manifest_sha256"
            printf 'manifest_size=%s\n' "$manifest_size"
          } >> "$GITHUB_OUTPUT"
      # Candidate code shares this runner user. Process-group cleanup reduces,
      # but cannot exclude, a deliberately re-sessioned orphan. This bounded
      # artifact is therefore an untrusted observation and never authority.
      - name: Upload exact candidate-validation artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinao-candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qinao-candidate-validation/artifact-manifest.json
            ${{ runner.temp }}/qinao-candidate-validation/validation-envelope.json
            ${{ runner.temp }}/qinao-candidate-validation/validation.log
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  prepare-current-wave:
    needs: candidate-validation
    if: ${{ github.ref == 'refs/heads/qinao-admission-bootstrap-v1' }}
    environment: qinao-admission
    runs-on:
      group: qinao-admission-jit
      labels: [self-hosted, macOS, qinao-admission]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      QINAO_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      QINAO_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
      QINAO_CURRENT_WAVE_BUNDLE_RELATIVE: ${{ inputs.current_wave_bundle }}
      QINAO_CANDIDATE_ARTIFACT_ID: ${{ needs.candidate-validation.outputs.artifact_id }}
      QINAO_CANDIDATE_ENVELOPE_SHA256: ${{ needs.candidate-validation.outputs.envelope_sha256 }}
      QINAO_CANDIDATE_ENVELOPE_SIZE: ${{ needs.candidate-validation.outputs.envelope_size }}
      QINAO_CANDIDATE_LOG_SHA256: ${{ needs.candidate-validation.outputs.log_sha256 }}
      QINAO_CANDIDATE_LOG_SIZE: ${{ needs.candidate-validation.outputs.log_size }}
      QINAO_CANDIDATE_MANIFEST_SHA256: ${{ needs.candidate-validation.outputs.manifest_sha256 }}
      QINAO_CANDIDATE_MANIFEST_SIZE: ${{ needs.candidate-validation.outputs.manifest_size }}
      QINAO_SOURCE_SELECTION: ${{ vars.QINAO_SOURCE_SELECTION }}
      QINAO_ADMISSION_TRUST_ROOT: ${{ vars.QINAO_ADMISSION_TRUST_ROOT }}
      QINAO_ADMISSION_TRUST_ROOT_SHA256: ${{ vars.QINAO_ADMISSION_TRUST_ROOT_SHA256 }}
      QINAO_PREVIOUS_ADMISSION_RECEIPT: ${{ vars.QINAO_PREVIOUS_ADMISSION_RECEIPT }}
      QINAO_EXTERNAL_PREREQUISITES: ${{ vars.QINAO_EXTERNAL_PREREQUISITES }}
      QINAO_PRIOR_ADMISSION_RECEIPTS: ${{ vars.QINAO_PRIOR_ADMISSION_RECEIPTS }}
      QINAO_RUNTIME_ENTRY_PREDECESSOR: ${{ vars.QINAO_RUNTIME_ENTRY_PREDECESSOR }}
      QINAO_REPOSITORY_RUNNER_SHA256: ${{ vars.QINAO_REPOSITORY_RUNNER_SHA256 }}
      QINAO_OWNER_LEDGER_CHECKER_SHA256: ${{ vars.QINAO_OWNER_LEDGER_CHECKER_SHA256 }}
      QINAO_PROTECTED_WORKFLOW_SHA256: ${{ vars.QINAO_PROTECTED_WORKFLOW_SHA256 }}
      QINAO_TRUSTED_TOOLS_RELATIVE: qinao-trusted-tools-${{ github.run_id }}-${{ github.run_attempt }}
      QINAO_CANDIDATE_DATA_RELATIVE: qinao-candidate-data-${{ github.run_id }}-${{ github.run_attempt }}
      GIT_ATTR_NOSYSTEM: "1"
      GIT_CONFIG_COUNT: "9"
      GIT_CONFIG_GLOBAL: "/dev/null"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_SYSTEM: "/dev/null"
      GIT_CONFIG_KEY_0: core.fsmonitor
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: /dev/null
      GIT_CONFIG_KEY_2: diff.external
      GIT_CONFIG_VALUE_2: ""
      GIT_CONFIG_KEY_3: core.pager
      GIT_CONFIG_VALUE_3: cat
      GIT_CONFIG_KEY_4: submodule.recurse
      GIT_CONFIG_VALUE_4: "false"
      GIT_CONFIG_KEY_5: filter.lfs.clean
      GIT_CONFIG_VALUE_5: ""
      GIT_CONFIG_KEY_6: filter.lfs.smudge
      GIT_CONFIG_VALUE_6: ""
      GIT_CONFIG_KEY_7: filter.lfs.process
      GIT_CONFIG_VALUE_7: ""
      GIT_CONFIG_KEY_8: filter.lfs.required
      GIT_CONFIG_VALUE_8: "false"
      GIT_LITERAL_PATHSPECS: "1"
      GIT_NO_LAZY_FETCH: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_PAGER: cat
      GIT_TERMINAL_PROMPT: "0"
      PAGER: cat
      XDG_CONFIG_HOME: /nonexistent
    steps:
      - name: Assert isolated preparation roots are absent
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ID" in ""|*[!0-9]*) exit 64 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ""|*[!0-9]*) exit 64 ;; esac
          test "$QINAO_TRUSTED_TOOLS_RELATIVE" = \
            "qinao-trusted-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$QINAO_CANDIDATE_DATA_RELATIVE" = \
            "qinao-candidate-data-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trusted_root="$GITHUB_WORKSPACE/$QINAO_TRUSTED_TOOLS_RELATIVE"
          candidate_root="$GITHUB_WORKSPACE/$QINAO_CANDIDATE_DATA_RELATIVE"
          case "$trusted_root" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) exit 64 ;;
          esac
          case "$candidate_root" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) exit 64 ;;
          esac
          test ! -e "$trusted_root"
          test ! -L "$trusted_root"
          test ! -e "$candidate_root"
          test ! -L "$candidate_root"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: ${{ env.QINAO_TRUSTED_TOOLS_RELATIVE }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_commit }}
          path: ${{ env.QINAO_CANDIDATE_DATA_RELATIVE }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Download exact candidate-validation artifact by service ID
        # The artifact service validates its upload digest during download.
        # The workflow independently binds the exact artifact ID plus each
        # allowed file's SHA-256 and byte length; no self-reported digest is
        # treated as a second trust source.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate-validation.outputs.artifact_id }}
          path: ${{ runner.temp }}/qinao-candidate-validation
          merge-multiple: true
      - name: Build unsigned report with pinned trusted tools
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/qinao-admission-bootstrap-v1"
          candidate_root="$GITHUB_WORKSPACE/$QINAO_CANDIDATE_DATA_RELATIVE"
          trusted_root="$GITHUB_WORKSPACE/$QINAO_TRUSTED_TOOLS_RELATIVE"
          qinao_read_head_object() {
            test "$#" -eq 2
            repository_root="$1"
            case "$2" in
              commit) object_expression='HEAD^{commit}' ;;
              tree) object_expression='HEAD^{tree}' ;;
              *) return 64 ;;
            esac
            /usr/bin/env -i \
              HOME=/nonexistent \
              LANG=C \
              LC_ALL=C \
              PATH=/usr/bin:/bin \
              XDG_CONFIG_HOME=/nonexistent \
              GIT_ATTR_NOSYSTEM=1 \
              GIT_CONFIG_COUNT=9 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_CONFIG_KEY_0=core.fsmonitor \
              GIT_CONFIG_VALUE_0=false \
              GIT_CONFIG_KEY_1=core.hooksPath \
              GIT_CONFIG_VALUE_1=/dev/null \
              GIT_CONFIG_KEY_2=diff.external \
              GIT_CONFIG_VALUE_2= \
              GIT_CONFIG_KEY_3=core.pager \
              GIT_CONFIG_VALUE_3=cat \
              GIT_CONFIG_KEY_4=submodule.recurse \
              GIT_CONFIG_VALUE_4=false \
              GIT_CONFIG_KEY_5=filter.lfs.clean \
              GIT_CONFIG_VALUE_5= \
              GIT_CONFIG_KEY_6=filter.lfs.smudge \
              GIT_CONFIG_VALUE_6= \
              GIT_CONFIG_KEY_7=filter.lfs.process \
              GIT_CONFIG_VALUE_7= \
              GIT_CONFIG_KEY_8=filter.lfs.required \
              GIT_CONFIG_VALUE_8=false \
              GIT_LITERAL_PATHSPECS=1 \
              GIT_NO_LAZY_FETCH=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_PAGER=cat \
              GIT_TERMINAL_PROMPT=0 \
              PAGER=cat \
              /usr/bin/git \
                --no-pager \
                --no-optional-locks \
                --no-replace-objects \
                -C "$repository_root" \
                rev-parse --verify "$object_expression"
          }
          QINAO_REPOSITORY_RUNNER="$trusted_root/scripts/run_qinao_wave_admission.py"
          QINAO_OWNER_LEDGER_CHECKER="$trusted_root/scripts/check_qinao_owner_ledger.py"
          QINAO_PROTECTED_WORKFLOW="$trusted_root/.github/workflows/qinao-wave-admission.yml"
          QINAO_UNSIGNED_ADMISSION_REPORT="$RUNNER_TEMP/qinao-unsigned-report.json"
          artifact_root="$RUNNER_TEMP/qinao-candidate-validation"

          for variable in \
            QINAO_CANDIDATE_COMMIT \
            QINAO_CANDIDATE_TREE \
            QINAO_CURRENT_WAVE_BUNDLE_RELATIVE \
            QINAO_CANDIDATE_ARTIFACT_ID \
            QINAO_CANDIDATE_ENVELOPE_SHA256 \
            QINAO_CANDIDATE_ENVELOPE_SIZE \
            QINAO_CANDIDATE_LOG_SHA256 \
            QINAO_CANDIDATE_LOG_SIZE \
            QINAO_CANDIDATE_MANIFEST_SHA256 \
            QINAO_CANDIDATE_MANIFEST_SIZE \
            QINAO_SOURCE_SELECTION \
            QINAO_ADMISSION_TRUST_ROOT \
            QINAO_ADMISSION_TRUST_ROOT_SHA256 \
            QINAO_PREVIOUS_ADMISSION_RECEIPT \
            QINAO_REPOSITORY_RUNNER_SHA256 \
            QINAO_OWNER_LEDGER_CHECKER_SHA256 \
            QINAO_PROTECTED_WORKFLOW_SHA256
          do
            test -n "${!variable}"
          done
          case "$QINAO_CANDIDATE_ARTIFACT_ID" in
            *[!0-9]*|"") exit 1 ;;
          esac
          case "$QINAO_CURRENT_WAVE_BUNDLE_RELATIVE" in
            ""|/*|*\\*|*..*) exit 1 ;;
          esac
          canonical_external_path() {
            /usr/bin/python3 -c 'from pathlib import Path; import sys; path=Path(sys.argv[1]).resolve(strict=True); roots=[Path(value).resolve(strict=True) for value in sys.argv[2:]]; sys.exit(1) if any(path == root or root in path.parents for root in roots) else print(path)' "$@"
          }
          bind_external_input() {
            test "$#" -eq 3
            input_path="$1"
            input_fd="$2"
            input_label="$3"
            case "$input_path" in
              *$'\n'*|*$'\r'*) exit 1 ;;
              /*) ;;
              *) exit 1 ;;
            esac
            test -f "$input_path"
            test ! -L "$input_path"
            input_path="$(
              canonical_external_path "$input_path" "$GITHUB_WORKSPACE"
            )"
            input_path_binding="$(stat -L -f '%d:%i' "$input_path")"
            case "$input_fd" in
              30) exec 30<"$input_path" ;;
              31) exec 31<"$input_path" ;;
              32) exec 32<"$input_path" ;;
              *) exit 64 ;;
            esac
            input_metadata="$(/usr/bin/python3 -c 'import os,stat,sys; value=os.fstat(int(sys.argv[1])); print(f"{value.st_dev}:{value.st_ino} {value.st_nlink} {stat.S_IMODE(value.st_mode):o} {int(stat.S_ISREG(value.st_mode))} {value.st_size} {value.st_mtime_ns} {value.st_ctime_ns}")' "$input_fd")"
            read -r \
              input_binding \
              input_link_count \
              input_mode \
              input_regular \
              _input_size \
              _input_mtime \
              _input_ctime \
              <<< "$input_metadata"
            test "$input_path_binding" = "$input_binding"
            test "$input_link_count" -eq 1
            test "$input_mode" = 600
            test "$input_regular" -eq 1
            test ! -L "$input_path"
            bound_external_path="/dev/fd/$input_fd"
            bound_external_binding="$input_binding"
            bound_external_metadata="$input_metadata"
            printf '%s\n' "$input_label bound to $bound_external_path"
          }
          assert_bound_input_unchanged() {
            test "$#" -eq 3
            input_fd="$1"
            expected_metadata="$2"
            input_label="$3"
            actual_metadata="$(/usr/bin/python3 -c 'import os,stat,sys; value=os.fstat(int(sys.argv[1])); print(f"{value.st_dev}:{value.st_ino} {value.st_nlink} {stat.S_IMODE(value.st_mode):o} {int(stat.S_ISREG(value.st_mode))} {value.st_size} {value.st_mtime_ns} {value.st_ctime_ns}")' "$input_fd")"
            test "$actual_metadata" = "$expected_metadata"
            printf '%s\n' "$input_label remained bound and unchanged"
          }

          source_selection_fd=30
          bind_external_input \
            "$QINAO_SOURCE_SELECTION" \
            "$source_selection_fd" \
            "source selection"
          bound_source_selection="$bound_external_path"
          source_selection_binding="$bound_external_binding"
          source_selection_metadata="$bound_external_metadata"
          trust_root_fd=31
          bind_external_input \
            "$QINAO_ADMISSION_TRUST_ROOT" \
            "$trust_root_fd" \
            "trust root"
          bound_trust_root="$bound_external_path"
          trust_root_binding="$bound_external_binding"
          trust_root_metadata="$bound_external_metadata"
          previous_receipt_fd=32
          bind_external_input \
            "$QINAO_PREVIOUS_ADMISSION_RECEIPT" \
            "$previous_receipt_fd" \
            "previous receipt"
          bound_previous_receipt="$bound_external_path"
          previous_receipt_binding="$bound_external_binding"
          previous_receipt_metadata="$bound_external_metadata"
          test "$source_selection_binding" != "$trust_root_binding"
          test "$source_selection_binding" != "$previous_receipt_binding"
          test "$trust_root_binding" != "$previous_receipt_binding"

          expected_files=$'artifact-manifest.json\nvalidation-envelope.json\nvalidation.log'
          actual_files="$(
            find "$artifact_root" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test -z "$(
            find "$artifact_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          test "$(shasum -a 256 "$artifact_root/validation-envelope.json" | cut -d ' ' -f 1)" = "$QINAO_CANDIDATE_ENVELOPE_SHA256"
          test "$(wc -c < "$artifact_root/validation-envelope.json" | tr -d ' ')" = "$QINAO_CANDIDATE_ENVELOPE_SIZE"
          test "$(shasum -a 256 "$artifact_root/validation.log" | cut -d ' ' -f 1)" = "$QINAO_CANDIDATE_LOG_SHA256"
          test "$(wc -c < "$artifact_root/validation.log" | tr -d ' ')" = "$QINAO_CANDIDATE_LOG_SIZE"
          test "$QINAO_CANDIDATE_LOG_SIZE" -le 8388608
          test "$(shasum -a 256 "$artifact_root/artifact-manifest.json" | cut -d ' ' -f 1)" = "$QINAO_CANDIDATE_MANIFEST_SHA256"
          test "$(wc -c < "$artifact_root/artifact-manifest.json" | tr -d ' ')" = "$QINAO_CANDIDATE_MANIFEST_SIZE"
          test "$QINAO_CANDIDATE_ENVELOPE_SIZE" -le 4096
          test "$QINAO_CANDIDATE_MANIFEST_SIZE" -le 4096
          artifact_total_size=$((
            QINAO_CANDIDATE_ENVELOPE_SIZE +
            QINAO_CANDIDATE_LOG_SIZE +
            QINAO_CANDIDATE_MANIFEST_SIZE
          ))
          test "$artifact_total_size" -le 8396800

          test "$(shasum -a 256 "$bound_trust_root" | cut -d ' ' -f 1)" = "$QINAO_ADMISSION_TRUST_ROOT_SHA256"
          test "$(shasum -a 256 "$QINAO_PROTECTED_WORKFLOW" | cut -d ' ' -f 1)" = "$QINAO_PROTECTED_WORKFLOW_SHA256"
          for script in \
            "$QINAO_REPOSITORY_RUNNER" \
            "$QINAO_OWNER_LEDGER_CHECKER"
          do
            test -f "$script"
            test ! -L "$script"
            test -r "$script"
            test "$(stat -f '%l' "$script")" -eq 1
            test "$(stat -f '%z' "$script")" -le 8388608
            script_mode="$(stat -f '%Lp' "$script")"
            (( (8#$script_mode & 8#22) == 0 ))
          done

          repository_runner_fd=10
          owner_checker_fd=11
          exec 10<"$QINAO_REPOSITORY_RUNNER"
          exec 11<"$QINAO_OWNER_LEDGER_CHECKER"
          test "$(shasum -a 256 "/dev/fd/$repository_runner_fd" | cut -d ' ' -f 1)" = "$QINAO_REPOSITORY_RUNNER_SHA256"
          test "$(shasum -a 256 "/dev/fd/$owner_checker_fd" | cut -d ' ' -f 1)" = "$QINAO_OWNER_LEDGER_CHECKER_SHA256"

          rewind_fd() {
            /usr/bin/python3 - "$1" <<'PY'
          import os
          import sys
          os.lseek(int(sys.argv[1]), 0, os.SEEK_SET)
          PY
          }
          rewind_fd "$repository_runner_fd"
          rewind_fd "$owner_checker_fd"

          expected_manifest="{\"files\":[{\"byteLength\":$QINAO_CANDIDATE_ENVELOPE_SIZE,\"path\":\"validation-envelope.json\",\"sha256\":\"$QINAO_CANDIDATE_ENVELOPE_SHA256\"},{\"byteLength\":$QINAO_CANDIDATE_LOG_SIZE,\"path\":\"validation.log\",\"sha256\":\"$QINAO_CANDIDATE_LOG_SHA256\"}],\"schema\":\"QinaoCandidateValidationArtifactV1\"}"
          expected_manifest_path="$RUNNER_TEMP/qinao-expected-artifact-manifest.json"
          printf '%s\n' "$expected_manifest" > "$expected_manifest_path"
          cmp -s "$expected_manifest_path" "$artifact_root/artifact-manifest.json"
          expected_envelope="{\"authority\":\"none\",\"candidateCommit\":\"$QINAO_CANDIDATE_COMMIT\",\"candidateTree\":\"$QINAO_CANDIDATE_TREE\",\"outcome\":\"observed\",\"provenance\":\"candidate-runner-untrusted-observation\",\"schema\":\"QinaoCandidateValidationEnvelopeV1\"}"
          expected_envelope_path="$RUNNER_TEMP/qinao-expected-validation-envelope.json"
          printf '%s\n' "$expected_envelope" > "$expected_envelope_path"
          cmp -s "$expected_envelope_path" "$artifact_root/validation-envelope.json"

          test "$(qinao_read_head_object "$candidate_root" commit)" = \
            "$QINAO_CANDIDATE_COMMIT"
          test "$(qinao_read_head_object "$candidate_root" tree)" = \
            "$QINAO_CANDIDATE_TREE"
          test ! -e "$QINAO_UNSIGNED_ADMISSION_REPORT"
          test ! -L "$QINAO_UNSIGNED_ADMISSION_REPORT"

          prerequisite_args=()
          if test -n "$QINAO_EXTERNAL_PREREQUISITES"; then
            while IFS= read -r prerequisite; do
              test -n "$prerequisite"
              prerequisite_args+=(--external-prerequisite "$prerequisite")
            done <<< "$QINAO_EXTERNAL_PREREQUISITES"
          fi
          expected_prior_wave_slice_ids=(
            w6.runtime.observation-values
            w6.semantic.audit-schema
            w6.runtime.audit-envelope-freeze
            w6.semantic.coordinator-behavior
            w6.runtime.integration-population
          )
          prior_receipt_args=()
          prior_receipt_bindings=(
            "$source_selection_binding"
            "$trust_root_binding"
            "$previous_receipt_binding"
          )
          prior_receipt_fds=()
          prior_receipt_index=0
          if test -n "$QINAO_PRIOR_ADMISSION_RECEIPTS"; then
            while IFS= read -r prior_receipt; do
              test -n "$prior_receipt"
              case "$prior_receipt" in
                *$'\r'*|*=*=*|=*) exit 1 ;;
                *=*) ;;
                *) exit 1 ;;
              esac
              prior_wave_slice_id="${prior_receipt%%=*}"
              prior_receipt_path="${prior_receipt#*=}"
              test "$prior_receipt_index" -lt "${#expected_prior_wave_slice_ids[@]}"
              test "$prior_wave_slice_id" = "${expected_prior_wave_slice_ids[$prior_receipt_index]}"
              test -n "$prior_receipt_path"
              case "$prior_receipt_path" in
                /*) ;;
                *) exit 1 ;;
              esac
              test -f "$prior_receipt_path"
              test ! -L "$prior_receipt_path"
              prior_receipt_path="$(
                canonical_external_path \
                  "$prior_receipt_path" \
                  "$GITHUB_WORKSPACE"
              )"
              prior_receipt_path_binding="$(stat -L -f '%d:%i' "$prior_receipt_path")"
              case "$prior_receipt_index" in
                0) prior_receipt_fd=20; exec 20<"$prior_receipt_path" ;;
                1) prior_receipt_fd=21; exec 21<"$prior_receipt_path" ;;
                2) prior_receipt_fd=22; exec 22<"$prior_receipt_path" ;;
                3) prior_receipt_fd=23; exec 23<"$prior_receipt_path" ;;
                4) prior_receipt_fd=24; exec 24<"$prior_receipt_path" ;;
                *) exit 1 ;;
              esac
              prior_receipt_metadata="$(/usr/bin/python3 -c 'import os,stat,sys; value=os.fstat(int(sys.argv[1])); print(f"{value.st_dev}:{value.st_ino} {value.st_nlink} {stat.S_IMODE(value.st_mode):o} {int(stat.S_ISREG(value.st_mode))}")' "$prior_receipt_fd")"
              read -r prior_receipt_binding prior_receipt_link_count prior_receipt_mode prior_receipt_regular <<< "$prior_receipt_metadata"
              test "$prior_receipt_path_binding" = "$prior_receipt_binding"
              test "$prior_receipt_link_count" -eq 1
              test "$prior_receipt_mode" = 600
              test "$prior_receipt_regular" -eq 1
              test ! -L "$prior_receipt_path"
              for seen_prior_receipt_binding in ${prior_receipt_bindings[@]+"${prior_receipt_bindings[@]}"}; do
                test "$seen_prior_receipt_binding" != "$prior_receipt_binding"
              done
              prior_receipt_bindings+=("$prior_receipt_binding")
              prior_receipt_fds+=("$prior_receipt_fd")
              prior_receipt_args+=(--prior-admission-receipt "${prior_wave_slice_id}=/dev/fd/${prior_receipt_fd}")
              prior_receipt_index=$((prior_receipt_index + 1))
            done <<< "$QINAO_PRIOR_ADMISSION_RECEIPTS"
          fi
          runtime_entry_args=()
          if test -n "$QINAO_RUNTIME_ENTRY_PREDECESSOR"; then
            case "$QINAO_RUNTIME_ENTRY_PREDECESSOR" in
              *$'\n'*|*$'\r'*|*=*) exit 1 ;;
            esac
            case "$QINAO_RUNTIME_ENTRY_PREDECESSOR" in
              /*) ;;
              *) exit 1 ;;
            esac
            test -f "$QINAO_RUNTIME_ENTRY_PREDECESSOR"
            test ! -L "$QINAO_RUNTIME_ENTRY_PREDECESSOR"
            runtime_entry_path="$(
              canonical_external_path \
                "$QINAO_RUNTIME_ENTRY_PREDECESSOR" \
                "$GITHUB_WORKSPACE"
            )"
            runtime_entry_path_binding="$(stat -L -f '%d:%i' "$runtime_entry_path")"
            runtime_entry_fd=25
            exec 25<"$runtime_entry_path"
            runtime_entry_metadata="$(/usr/bin/python3 -c 'import os,stat,sys; value=os.fstat(int(sys.argv[1])); print(f"{value.st_dev}:{value.st_ino} {value.st_nlink} {stat.S_IMODE(value.st_mode):o} {int(stat.S_ISREG(value.st_mode))}")' "$runtime_entry_fd")"
            read -r runtime_entry_binding runtime_entry_link_count runtime_entry_mode runtime_entry_regular <<< "$runtime_entry_metadata"
            test "$runtime_entry_path_binding" = "$runtime_entry_binding"
            test "$runtime_entry_link_count" -eq 1
            test "$runtime_entry_mode" = 600
            test "$runtime_entry_regular" -eq 1
            test ! -L "$QINAO_RUNTIME_ENTRY_PREDECESSOR"
            for prior_receipt_binding in ${prior_receipt_bindings[@]+"${prior_receipt_bindings[@]}"}; do
              test "$prior_receipt_binding" != "$runtime_entry_binding"
            done
            runtime_entry_args+=(--runtime-entry-predecessor "/dev/fd/$runtime_entry_fd")
          fi
          QINAO_PINNED_REPOSITORY_RUNNER="/dev/fd/$repository_runner_fd" \
          QINAO_PINNED_OWNER_LEDGER_CHECKER="/dev/fd/$owner_checker_fd" \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONNOUSERSITE=1 \
          PYTHONPATH="$trusted_root" \
          /usr/bin/python3 "/dev/fd/$repository_runner_fd" report \
            --git-executable /usr/bin/git \
            --root "$candidate_root" \
            --bundle "$candidate_root/$QINAO_CURRENT_WAVE_BUNDLE_RELATIVE" \
            --source-selection "$bound_source_selection" \
            --trust-root "$bound_trust_root" \
            --previous-receipt "$bound_previous_receipt" \
            --candidate-tree "$QINAO_CANDIDATE_TREE" \
            ${prerequisite_args[@]+"${prerequisite_args[@]}"} \
            ${prior_receipt_args[@]+"${prior_receipt_args[@]}"} \
            ${runtime_entry_args[@]+"${runtime_entry_args[@]}"} \
            --unsigned-report "$QINAO_UNSIGNED_ADMISSION_REPORT"
          assert_bound_input_unchanged \
            "$source_selection_fd" \
            "$source_selection_metadata" \
            "source selection"
          assert_bound_input_unchanged \
            "$trust_root_fd" \
            "$trust_root_metadata" \
            "trust root"
          assert_bound_input_unchanged \
            "$previous_receipt_fd" \
            "$previous_receipt_metadata" \
            "previous receipt"
          test -f "$QINAO_UNSIGNED_ADMISSION_REPORT"
          test ! -L "$QINAO_UNSIGNED_ADMISSION_REPORT"
          test "$(stat -f '%l' "$QINAO_UNSIGNED_ADMISSION_REPORT")" -eq 1
          test "$(stat -f '%z' "$QINAO_UNSIGNED_ADMISSION_REPORT")" -le 8388608
          exec 20<&-
          exec 21<&-
          exec 22<&-
          exec 23<&-
          exec 24<&-
          exec 25<&-
          exec 30<&-
          exec 31<&-
          exec 32<&-
          exec 10<&-
          exec 11<&-
      - name: Upload unsigned report for protected review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qinao-unsigned-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qinao-unsigned-report.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
      - name: Block authority transition until Phase C wire exists
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "BLOCKED_PHASE_C_RUNNER_ISOLATION_ATTESTATION_REQUIRED"
          printf '%s\n' \
            "BLOCKED_PHASE_C_PROTECTED_REVIEW_OPERATION_WIRE"
          exit 1

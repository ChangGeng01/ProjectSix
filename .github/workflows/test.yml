name: Test + boundary checks

# M761 chapter 二百三 — first CI workflow.
# Triggers on every push + PR to main / branch.
# Runs: BAS XCTest + Qinao XCTest + 4 boundary scripts +
# cross-language schema parity gate + god-file size guard.

on:
  push:
    branches: [ main, "m605-chapter-*" ]
  pull_request:
    branches: [ main ]

jobs:
  bas-tests:
    name: BehavioralAISubstrate XCTest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: BAS test
        run: swift test --package-path BehavioralAISubstrate

  qinao-tests:
    name: QinaoRuntimeSDK XCTest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Qinao test
        working-directory: QinaoRuntimeSDK
        run: swift test

  # samplehost-tests — DISABLED 2026-05-20 (Before severance)
  #
  # SampleHost was previously built via the `SampleHost` scheme inside
  # `Before.xcodeproj`. The Before iOS app was severed to Archive/Legacy/
  # per user directive 「我想要 把 before 完全 断绝」,so the project
  # file is no longer at the repo root。 SampleHost itself has no
  # standalone Package.swift or .xcodeproj yet — it needs reconstitution
  # as either:
  #   (a) its own Xcode project (`SampleHost/SampleHost.xcodeproj`),
  #   (b) an SPM executable target with a separate test target,or
  #   (c) absorbed into BehavioralAISubstrate as an example target。
  #
  # Until then,SampleHost CI is disabled。 swift-test on the main
  # substrate (bas-tests job) + qinao-tests job + boundary-checks job
  # continue to gate CI。 See follow-up spawn_task for the standalone-
  # build-path reconstitution work。
  #
  # samplehost-tests:
  #   name: SampleHost iOS XCTest
  #   runs-on: macos-latest
  #   timeout-minutes: 45
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build for testing
  #       run: |
  #         xcodebuild -project Archive/Legacy/Before.xcodeproj \
  #           -scheme SampleHost \
  #           -configuration Debug \
  #           -destination 'platform=iOS Simulator,name=iPhone 17e' \
  #           build-for-testing
  #     - name: Test
  #       run: |
  #         xcodebuild -project Archive/Legacy/Before.xcodeproj \
  #           -scheme SampleHost \
  #           -configuration Debug \
  #           -destination 'platform=iOS Simulator,name=iPhone 17e' \
  #           test-without-building

  boundary-checks:
    name: 4 boundary scripts + schema parity
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Qinao import boundaries
        run: bash scripts/check_qinao_import_boundaries.sh
      - name: Sovereign redaction
        run: bash scripts/check_sovereign_redaction.sh
      - name: SDK import boundaries
        run: bash scripts/check_sdk_import_boundaries.sh
      - name: Substrate residuals
        run: bash scripts/check_substrate_residuals.sh
      - name: Cross-language schema parity
        run: python3 scripts/check_chenglu_schema_parity.py
      - name: God-file size guard (M762 chapter 203)
        run: bash scripts/check_god_files.sh

  python-fuzz:
    name: Python pytest fuzz tests
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pytest
        run: |
          pip install pytest
          python3 -m pytest scripts/test_chenglu_feature_schema.py -v

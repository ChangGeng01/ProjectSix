[package]
name = "bas-substrate-core"
description = "chapter 七百三 第一刀 — Rust port of substrate cryptographic + chain primitives previously living in BASSovereignAuditLedger.swift + the 17 CryptoKit SHA256 call sites scattered across BASSovereign / BASHostKit / BASMemory / BASOrchestration / BASObservability / BASOrgan / BASRuntimeCore"
license.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pure-Rust SHA256 + HMAC + Ed25519 implementations。 All
# no_std-compatible, no system dependencies。 Cleaner choice
# than the previous appendStep-zeros-32 trick that produced
# a length-prefixed digest instead of pure NIST SHA256。
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.1"
zeroize = "1.7"

[dev-dependencies]
hex = "0.4"

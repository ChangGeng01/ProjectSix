# Cargo manifest for bas-memory-usage-tracker
# chapter 七百六 / M2187 第一刀

[package]
name = "bas-memory-usage-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# `staticlib` so xcodebuild can wrap the `.a` into an
# XCFramework via -create-xcframework -library。
crate-type = ["staticlib"]
name = "bas_memory_usage_tracker"
path = "src/lib.rs"

[dependencies]
# 主线 Integrity 抽取 — well-trusted no_std SHA256
# implementation。 Used by the chain-hash FFI to compute
# a deterministic rolling SHA256 over canonically-ordered
# records。 default-features=false keeps the std-dep
# surface minimal and reproducible。
sha2 = { version = "0.10", default-features = false }

# chapter 七百四 第一刀 — depend on the 6 workspace
# crates from chapter 七百三 so they all link into the
# single staticlib that the XCFramework wraps。 Each
# dependency contributes its #[no_mangle] extern "C"
# ABI surface to the output .a。 force_link.rs holds
# references that prevent the rust linker from stripping
# the symbols。
bas-substrate-core    = { path = "../bas-substrate-core" }
bas-memory-atom-store = { path = "../bas-memory-atom-store" }
bas-retrieval-ranker  = { path = "../bas-retrieval-ranker" }
bas-canonical-bytes   = { path = "../bas-canonical-bytes" }
bas-permit-policy     = { path = "../bas-permit-policy" }
bas-event-log-codec   = { path = "../bas-event-log-codec" }
bas-runtime-frame     = { path = "../bas-runtime-frame" }
# chapter 七百二十二 第二刀 / M2282 — bundle the BPE tokenizer
# crate into the same staticlib so Swift hosts can call
# bas_tokenizer_* symbols via `import BASRustMemoryTrackerBinary`。
bas-tokenizer         = { path = "../bas-tokenizer" }
# chapter 七百四十 第二刀 / M2372 — bundle the L10 tribunal-court
# crate so Swift can call bas_tribunal_court_derive_* via the
# XCFramework。 Pairs with the chapter 七百三十九 layer-migration
# arc Rust-port idiom。
bas-tribunal-court    = { path = "../bas-tribunal-court" }
# chapter 七百四十七 第一刀 / M2406 — bundle the L2 organ-
# router crate so Swift can call bas_organ_router_select via
# the XCFramework。 Per user directive 「Metal/C++ 管 模型 内核,
# Rust 管 routing/adapter policy。」 The policy lives here;
# kernels stay Metal + Swift。
bas-organ-router      = { path = "../bas-organ-router" }
# chapter 七百四十八 第一刀 / M2411 — bundle the L9 dream-
# loop batch-scoring kernel。 Per user L9 sub-directive
# 「candidate simulation、future projection、batch scoring
# 适合 Rust/Metal。」
bas-dream-loop        = { path = "../bas-dream-loop" }
# chapter 七百五十八 第一刀 / M2441 — bundle the L14
# sovereign-c-abi public wrapper crate so Swift host
# (via XCFramework) + watchOS / 3rd-party C consumers
# (via the hand-curated header) both see the same symbol
# table for halt_signal_encode / integrity_scan /
# tamper_proof_audit。 Per user 严苛 table 「L14 极值得」
# DEEPER LAYER-MIGRATION ARC。
bas-sovereign-c-abi   = { path = "../bas-sovereign-c-abi" }
# chapter 七百五十九 第三刀 / M2448 — bundle the L11
# red-team-bench crate so Swift host (via XCFramework) +
# 3rd-party C consumers see the batch adversarial-prompt
# classifier symbols (bas_red_team_classify_batch,
# bas_red_team_bench_abi_version)。 Per user 严苛 table
# 「L11 极值得 (DEEPER)」 — 50-100× batch throughput vs
# Swift single-threaded .contains() per planning audit。
bas-red-team-bench    = { path = "../bas-red-team-bench" }
# chapter 七百六十 第三刀 / M2453 — bundle the L11
# typed integrity-sentinel crate so Swift host + 3rd-party
# C consumers see the structured ScanReport surface
# (bas_integrity_sentinel_scan,
# bas_integrity_sentinel_abi_version)。 Distinct from
# bas-sovereign-c-abi thin wrapper which only returns
# 4-bit hard_bits — this exposes full structured report。
bas-integrity-sentinel = { path = "../bas-integrity-sentinel" }

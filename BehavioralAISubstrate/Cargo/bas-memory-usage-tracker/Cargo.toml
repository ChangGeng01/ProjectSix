# Cargo manifest for bas-memory-usage-tracker
# chapter 七百六 / M2187 第一刀

[package]
name = "bas-memory-usage-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# `staticlib` so xcodebuild can wrap the `.a` into an
# XCFramework via -create-xcframework -library。
crate-type = ["staticlib"]
name = "bas_memory_usage_tracker"
path = "src/lib.rs"

[dependencies]
# 主线 Integrity 抽取 — well-trusted no_std SHA256
# implementation。 Used by the chain-hash FFI to compute
# a deterministic rolling SHA256 over canonically-ordered
# records。 default-features=false keeps the std-dep
# surface minimal and reproducible。
sha2 = { version = "0.10", default-features = false }
